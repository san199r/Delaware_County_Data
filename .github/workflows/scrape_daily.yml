name: Daily Probate Scraping

on:
  schedule:
    # Run daily at 6:00 AM IST (00:30 AM UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:
    # Allows manual trigger for testing

jobs:
  scrape:
    runs-on: windows-latest  # Use Windows as the script works best with it
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager openpyxl tk

      - name: Run Scraper
        run: |
          python Delaware_County_PA_Probate_Tool_V3.py --headless
          
      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Delaware_County_PA_Probate_Tool_Output.xlsx
          git commit -m "Auto-update: Latest Probate Records" || exit 0
          git push origin main
